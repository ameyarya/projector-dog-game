<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projector Dog Game</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
  #stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
  #stage canvas{position:absolute;left:0;top:0;width:1280px;height:720px}
  #grid{display:none}
  .h{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #ffd400;
     background:rgba(255,212,0,.22);cursor:grab;touch-action:none;display:none;box-sizing:border-box;
     color:#ffd400;font:700 16px/40px system-ui;text-align:center}
  .h.sel{background:rgba(255,212,0,.65);color:#000}
  body.cal .h{display:block}
  body.cal #grid{display:block}
  body.nocursor{cursor:none}
  #hud{position:fixed;left:16px;bottom:14px;font-size:14px;line-height:1.5;color:#9aa;background:rgba(0,0,0,.55);
       padding:8px 12px;border-radius:8px;transition:opacity .6s;pointer-events:none;max-width:560px}
  #hud.hide{opacity:0}
  #toast{position:fixed;right:16px;top:14px;font-size:18px;color:#ffd400;background:rgba(0,0,0,.6);padding:6px 12px;
         border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.on{opacity:1}
  #calmsg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-size:20px;color:#ffd400;
          pointer-events:none;display:none;text-shadow:0 0 8px #000}
  body.cal #calmsg{display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <canvas id="grid" width="1280" height="720"></canvas>
</div>
<div id="handles"></div>
<div id="calmsg">Drag the 4 yellow dots onto the corners of the area you want to use.<br>
  Arrow keys nudge the selected dot (Shift = bigger steps). Press <b>C</b> or <b>Enter</b> when it fits.</div>
<div id="hud"></div>
<div id="toast"></div>

<script>
(() => {
const W = 1280, H = 720, TAU = Math.PI * 2;
const stage = document.getElementById('stage');
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const gcv = document.getElementById('grid'), gctx = gcv.getContext('2d');
const hud = document.getElementById('hud'), toastEl = document.getElementById('toast');
const handlesEl = document.getElementById('handles');
const rnd = (a, b) => a + Math.random() * (b - a);

/* ================= corner-pin (projection mapping) ================= */
const KEY = 'projector-dog-game.v2';
let corners = [[.1,.1],[.9,.1],[.9,.9],[.1,.9]];     // fractions of the window: TL, TR, BR, BL
let state = { speed: 1, game: 'burrow', kind: 'squirrel', bg: 1, rev: 2 };
try {
  const s = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (s && s.corners) { corners = s.corners; Object.assign(state, s.state || {}); if (!state.rev){ state.rev = 2; state.bg = 1; } }
  else document.body.classList.add('cal');           // first run: start calibrating
} catch (e) { document.body.classList.add('cal'); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify({ corners, state })); } catch (e) {} }

const px = () => corners.map(([x,y]) => [x*innerWidth, y*innerHeight]);

function homography(src, dst){                        // 4 point pairs -> 8 coefficients (h33 = 1)
  const A = [];
  for (let i = 0; i < 4; i++){
    const [x,y] = src[i], [u,v] = dst[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y,u]);
    A.push([0,0,0,x,y,1,-v*x,-v*y,v]);
  }
  const n = 8;
  for (let c = 0; c < n; c++){
    let p = c;
    for (let r = c+1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    [A[c], A[p]] = [A[p], A[c]];
    for (let r = 0; r < n; r++){
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      for (let k = c; k <= n; k++) A[r][k] -= f * A[c][k];
    }
  }
  return A.map((row,i) => row[n] / row[i]);
}
const RECT = [[0,0],[W,0],[W,H],[0,H]];
let toStage = null;

function applyTransform(){
  const d = px();
  const h = homography(RECT, d);
  stage.style.transform =
    `matrix3d(${h[0]},${h[3]},0,${h[6]}, ${h[1]},${h[4]},0,${h[7]}, 0,0,1,0, ${h[2]},${h[5]},0,1)`;
  toStage = homography(d, RECT);
  handles.forEach((el,i) => { el.style.left = d[i][0]+'px'; el.style.top = d[i][1]+'px'; });
  drawGrid();
}
function screenToStage(x, y){
  const h = toStage, w = h[6]*x + h[7]*y + 1;
  return [(h[0]*x + h[1]*y + h[2]) / w, (h[3]*x + h[4]*y + h[5]) / w];
}

let sel = 0;
const handles = [0,1,2,3].map(i => {
  const el = document.createElement('div');
  el.className = 'h'; el.textContent = i+1;
  handlesEl.appendChild(el);
  el.addEventListener('pointerdown', e => {
    sel = i; markSel(); el.setPointerCapture(e.pointerId); el.style.cursor = 'grabbing';
    const move = ev => {
      corners[i] = [Math.min(1.2, Math.max(-.2, ev.clientX / innerWidth)),
                    Math.min(1.2, Math.max(-.2, ev.clientY / innerHeight))];
      applyTransform();
    };
    const up = () => { el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up);
                       el.style.cursor = 'grab'; save(); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up);
    e.preventDefault(); e.stopPropagation();
  });
  return el;
});
function markSel(){ handles.forEach((el,i) => el.classList.toggle('sel', i === sel)); }
markSel();

function drawGrid(){
  const g = gctx; g.clearRect(0,0,W,H);
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0,0,W,H);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 2;
  for (let x = 0; x <= W; x += 80){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke(); }
  for (let y = 0; y <= H; y += 80){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.strokeStyle = '#ffd400'; g.lineWidth = 8; g.strokeRect(4,4,W-8,H-8);
  g.lineWidth = 2; g.beginPath(); g.moveTo(0,0); g.lineTo(W,H); g.moveTo(W,0); g.lineTo(0,H); g.stroke();
  g.fillStyle = '#ffd400'; g.font = '700 40px system-ui'; g.textAlign = 'left'; g.textBaseline = 'top';
  g.fillText('1', 16, 14); g.textAlign = 'right'; g.fillText('2', W-16, 14);
  g.textBaseline = 'bottom'; g.fillText('3', W-16, H-14); g.textAlign = 'left'; g.fillText('4', 16, H-14);
}

/* ================= shared effects ================= */
const parts = [];     // dirt / sparkle specks
const rings = [];     // expanding glow rings
const stars = [];     // gold stars on a catch
let clock = 0;

function dirt(x, y, n, col = '#e0b070'){
  for (let i = 0; i < n; i++)
    parts.push({ x: x + rnd(-40,40), y: y + rnd(-6,10), vx: rnd(-130,130), vy: rnd(-260,-90), life: 1, r: rnd(3,8),
                 col: Math.random() < .3 ? '#a8d94c' : col });
}
function ring(x, y, col = '255,200,60'){ rings.push({ x, y, r: 20, life: 1, col }); }
function burstStars(x, y){
  for (let i = 0; i < 12; i++) stars.push({ x, y, a: rnd(0, TAU), v: rnd(140, 330), life: 1, rot: rnd(0, TAU) });
}
function star(g, x, y, r, rot){
  g.beginPath();
  for (let i = 0; i < 10; i++){
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r;
    g[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill();
}
function updateFx(dt){
  for (const p of parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 700*dt; p.life -= dt*1.5; }
  for (const r of rings){ r.r += 260*dt; r.life -= dt*1.3; }
  for (const s of stars){ s.x += Math.cos(s.a)*s.v*dt; s.y += Math.sin(s.a)*s.v*dt; s.v *= .985; s.life -= dt*1.1; s.rot += dt*5; }
  for (const a of [parts, rings, stars]) for (let i = a.length - 1; i >= 0; i--) if (a[i].life <= 0) a.splice(i, 1);
}
function drawFx(){
  for (const p of parts){ ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
  for (const r of rings){ ctx.globalAlpha = Math.max(0, r.life) * .8; ctx.strokeStyle = `rgb(${r.col})`; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .4, 0, 0, TAU); ctx.stroke(); }
  for (const s of stars){ const a = Math.max(0, s.life);
    ctx.fillStyle = '#ffb000'; ctx.globalAlpha = a * .3; star(ctx, s.x, s.y, 34, s.rot);
    ctx.fillStyle = '#ffd84a'; ctx.globalAlpha = a; star(ctx, s.x, s.y, 20, s.rot); }
  ctx.globalAlpha = 1;
}

/* ================= hand-drawn critters (local coords: origin = base, up is -y, ~170px tall) ================= */
const mk = (w, h, fn) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; };
function lin(g, y0, y1, a, b){ const k = g.createLinearGradient(0, y0, 0, y1); k.addColorStop(0, a); k.addColorStop(1, b); return k; }
function rad(g, x, y, r0, r1, stops){ const k = g.createRadialGradient(x, y, r0, x, y, r1); stops.forEach(([o, c]) => k.addColorStop(o, c)); return k; }
function ell(g, x, y, rx, ry, fill, rot = 0, ol = null){
  g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fillStyle = fill; g.fill();
  if (ol){ g.strokeStyle = ol; g.lineWidth = 2.5; g.stroke(); }
}
function shine(g, x, y, rx, ry, a = .2, rot = -.5){ ell(g, x, y, rx, ry, `rgba(255,255,255,${a})`, rot); }
function eye(g, x, y, r, blink){
  if (blink > .6){ g.strokeStyle = '#1b1210'; g.lineWidth = 3.2; g.lineCap = 'round';
    g.beginPath(); g.arc(x, y - 2, r * .85, .12 * Math.PI, .88 * Math.PI); g.stroke(); return; }
  ell(g, x, y, r, r * (1 - blink * .9), '#140c0a');
  ell(g, x, y + r * .4, r * .7, r * .38 * (1 - blink), 'rgba(150,95,60,.55)');
  ell(g, x + r * .38, y - r * .38, r * .38, r * .38, '#fff');
  ell(g, x - r * .38, y + r * .3, r * .16, r * .16, 'rgba(255,255,255,.8)');
}
const HALO = mk(300, 300, g => { g.fillStyle = rad(g, 150, 150, 10, 140, [[0,'rgba(255,238,196,.6)'],[.55,'rgba(255,220,150,.22)'],[1,'rgba(255,220,150,0)']]); g.fillRect(0, 0, 300, 300); });
function halo(g){ g.drawImage(HALO, -150, -230); }        // lifts dark critters off a dark floor (centered at 0,-80)

function drawSquirrel(g, t, o){
  const OL = '#4d220c', lx = o.look * 5;
  g.save(); g.translate(54, -18); g.rotate(.3 + Math.sin(t * 2.6) * .12);                       // fluffy tail
  ell(g, 0, -74, 40, 90, lin(g, 0, -170, '#a84d18', '#f2a458'), 0, OL);
  ell(g, -10, -98, 13, 54, 'rgba(255,226,172,.5)');
  g.strokeStyle = 'rgba(110,46,12,.5)'; g.lineWidth = 2.5; g.lineCap = 'round';
  for (let i = 0; i < 6; i++){ const yy = -26 - i * 24; g.beginPath(); g.moveTo(18, yy); g.quadraticCurveTo(26, yy - 8, 20, yy - 20); g.stroke(); }
  g.restore();
  ell(g, 0, -34, 47, 62, lin(g, -92, 22, '#c76b2b', '#8c4118'), 0, OL);                          // body
  ell(g, 0, -26, 27, 44, lin(g, -70, 18, '#fbe6c0', '#ecc891'));                                  // belly
  shine(g, -20, -60, 9, 22, .16, .3);
  ell(g, lx - 31, -132, 14, 15, '#b85a22', 0, OL); ell(g, lx + 31, -132, 14, 15, '#b85a22', 0, OL);   // ears
  ell(g, lx - 31, -131, 7, 8, '#f4aa8c'); ell(g, lx + 31, -131, 7, 8, '#f4aa8c');
  g.strokeStyle = '#6a2e0e'; g.lineWidth = 2.5;                                                   // ear tufts
  for (const s of [-1, 1]){ g.beginPath(); g.moveTo(lx + s * 31, -146); g.lineTo(lx + s * 35, -160); g.stroke(); }
  ell(g, lx, -98, 47, 40, lin(g, -140, -58, '#d98238', '#bd6126'), 0, OL);                        // head
  g.strokeStyle = 'rgba(255,232,185,.55)'; g.lineWidth = 3; g.beginPath(); g.ellipse(lx, -98, 43, 36, 0, -1.25, -.25); g.stroke();   // rim light
  ell(g, lx, -84, 32, 24, lin(g, -108, -62, '#fbe6c0', '#f0d09a'));                              // muzzle
  eye(g, lx - 18, -104, 8, o.blink); eye(g, lx + 18, -104, 8, o.blink);
  ell(g, lx - 31, -88, 8, 5, 'rgba(255,120,120,.4)'); ell(g, lx + 31, -88, 8, 5, 'rgba(255,120,120,.4)');
  ell(g, lx, -92, 5.5, 4, '#3a2016'); shine(g, lx - 1.5, -93.5, 2, 1.2, .7);
  g.fillStyle = '#fff'; g.strokeStyle = '#7a5a40'; g.lineWidth = 1.5;                             // buck teeth
  g.beginPath(); g.roundRect(lx - 6, -86, 12, 11, 2); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(lx, -86); g.lineTo(lx, -75); g.stroke();
  ell(g, -17, -48, 10, 8, '#8a4217', 0, OL); ell(g, 17, -48, 10, 8, '#8a4217', 0, OL);          // paws
  ell(g, 0, -52, 13, 11, lin(g, -64, -40, '#c08a3c', '#8c5e22'), 0, '#4a2f10'); ell(g, 0, -60, 13, 6, '#5b3a1a', 0, '#3a240e'); shine(g, -4, -55, 3, 5, .35);
}
function drawMole(g, t, o){
  const OL = '#2d2438', lx = o.look * 5;
  ell(g, 0, -34, 52, 64, lin(g, -100, 22, '#74688a', '#463d56'), 0, OL);
  shine(g, -26, -62, 10, 26, .14, .3);
  ell(g, lx, -92, 46, 40, lin(g, -135, -55, '#85789b', '#5a4e6b'), 0, OL);
  g.strokeStyle = 'rgba(220,210,255,.4)'; g.lineWidth = 3; g.beginPath(); g.ellipse(lx, -92, 42, 36, 0, -1.25, -.25); g.stroke();
  eye(g, lx - 24, -102, 4.8, o.blink); eye(g, lx + 24, -102, 4.8, o.blink);
  ell(g, lx, -68, 20, 10, '#9c8fb0');
  for (let i = 0; i < 9; i++){ const a = i / 9 * TAU + Math.sin(t * 5) * .08 + i; ell(g, lx + Math.cos(a) * 14, -82 + Math.sin(a) * 12, 4.8, 4.8, '#ff9eb5', 0, '#b0506c'); }
  ell(g, lx, -82, 11, 10, '#ff7f9f', 0, '#b0506c'); shine(g, lx - 3, -85, 3.5, 2.5, .6);
  for (const s of [-1, 1]){
    ell(g, s * 46, -34, 22, 14, lin(g, -48, -20, '#f7c8b8', '#e2a392'), s * .4, '#a0645a');
    g.strokeStyle = '#fff6e6'; g.lineWidth = 4; g.lineCap = 'round';
    for (let k = -1; k <= 1; k++){ g.beginPath(); g.moveTo(s * (52 + k * 2), -34 + k * 9); g.lineTo(s * (67 + k * 2), -34 + k * 12); g.stroke(); }
  }
}
function drawBunny(g, t, o){
  const OL = '#8a7466', lx = o.look * 5, sw = Math.sin(t * 2.2) * .06;
  for (const s of [-1, 1]){
    g.save(); g.translate(lx + s * 22, -128); g.rotate(s * .18 + sw * s);
    ell(g, 0, -34, 15, 48, lin(g, -80, 10, '#fffaf4', '#eadfd4'), 0, OL); ell(g, 0, -30, 8, 36, lin(g, -66, 6, '#f9c4cd', '#ee9fb0'));
    g.restore();
  }
  ell(g, 0, -34, 46, 62, lin(g, -92, 22, '#fffaf4', '#d9cabb'), 0, OL);
  shine(g, -20, -60, 9, 22, .3, .3);
  ell(g, lx, -96, 46, 40, lin(g, -138, -56, '#fffdf8', '#efe4d8'), 0, OL);
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 3; g.beginPath(); g.ellipse(lx, -96, 42, 36, 0, -1.25, -.25); g.stroke();
  eye(g, lx - 19, -102, 7, o.blink); eye(g, lx + 19, -102, 7, o.blink);
  ell(g, lx - 30, -86, 8, 5, 'rgba(255,130,150,.45)'); ell(g, lx + 30, -86, 8, 5, 'rgba(255,130,150,.45)');
  ell(g, lx, -90, 6, 4.5, '#f08fa0', 0, '#b05a70'); shine(g, lx - 1.5, -91.5, 2, 1.2, .7);
  g.strokeStyle = '#bba998'; g.lineWidth = 1.5;
  for (const s of [-1, 1]) for (let k = -1; k <= 1; k++){ g.beginPath(); g.moveTo(lx + s * 14, -86 + k * 3); g.lineTo(lx + s * 42, -88 + k * 8); g.stroke(); }
  g.fillStyle = '#fff'; g.strokeStyle = '#a99'; g.beginPath(); g.roundRect(lx - 6, -85, 12, 11, 2); g.fill(); g.stroke();
  ell(g, -16, -46, 10, 8, '#efe3d6', 0, OL); ell(g, 16, -46, 10, 8, '#efe3d6', 0, OL);
}
function drawOrb(g, t){
  const r = 44 + Math.sin(t * 6) * 3;
  g.fillStyle = rad(g, 0, -52, 2, r * 2, [[0,'#fff'],[.22,'#ffe84a'],[1,'rgba(255,200,0,0)']]);
  g.beginPath(); g.arc(0, -52, r * 2, 0, TAU); g.fill();
}
const KINDS = {
  squirrel: { draw: drawSquirrel, emoji: '🐿️', label: 'Squirrel' },
  mole:     { draw: drawMole,     emoji: '🐭',  label: 'Mole' },
  bunny:    { draw: drawBunny,    emoji: '🐰',  label: 'Bunny' },
  dot:      { draw: drawOrb,      emoji: null,  label: 'Glow dot' },
};
const KIND_ORDER = Object.keys(KINDS);

/* ================= burrow game (whack-a-mole style) ================= */
const LAYOUT = [[250,215],[640,165],[1030,225],[420,520],[860,545]];
const FLOWERS = ['#ff8ad0', '#ffe45c', '#9ad7ff', '#ffffff'];
const holes = LAYOUT.map(([x, y], i) => {
  const s = .78 + .42 * (y / H);
  const pebbles = Array.from({ length: 26 }, (_, k) => ({ a: k / 26 * TAU + rnd(-.08, .08), w: rnd(9, 19), h: rnd(6, 11), r: rnd(0, .4) }));
  const tufts = [-2.5, -2.0, -1.0, -.55].map((a, k) => ({ a: a + rnd(-.1, .1), n: 4 + (k % 2), len: rnd(34, 52) }));
  const h = { x, y, s, rx: 122 * s, ry: 46 * s, pebbles, tufts, rustle: 0, glow: 0, id: i };
  bakeHole(h);
  return h;
});
const B = { hole: null, last: -1, ph: 'idle', t: .8, p: 0, max: 1, hold: 0, look: 0, lookTo: 0, lookT: 0, blink: 0, blinkT: 2, caught: 0, shake: 0 };
const easeOutBack = x => { const c1 = 2.3, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const sp = () => state.speed;

function pickHole(){
  const cands = holes.filter(h => h.id !== B.last);
  const from = B.hole || holes[2];
  cands.sort((a, b) => Math.hypot(b.x - from.x, b.y - from.y) - Math.hypot(a.x - from.x, a.y - from.y));
  return cands[Math.floor(Math.random() * Math.min(3, cands.length))];   // favour far holes so the dog has to run
}
function popY(h){ return h.y - 80 * h.s * Math.min(1, B.p); }
function catchIt(){
  if (state.game === 'roam') return roamCatch();
  if (B.caught > 0 || !B.hole || (B.ph !== 'rise' && B.ph !== 'up')) return;
  B.ph = 'caught'; B.caught = .9; B.p = Math.max(B.p, .8);
  burstStars(B.hole.x, popY(B.hole)); ring(B.hole.x, B.hole.y, '255,230,90'); toast('Caught! Treat time');
}
function updateBurrow(dt){
  const s = sp();
  B.blinkT -= dt; if (B.blinkT <= 0){ B.blink = 1; B.blinkT = rnd(1.5, 3.5); }
  B.blink = Math.max(0, B.blink - dt * 8);
  B.lookT -= dt; if (B.lookT <= 0){ B.lookTo = rnd(-1, 1); B.lookT = rnd(.5, 1.2); }
  B.look += (B.lookTo - B.look) * Math.min(1, dt * 8);
  for (const h of holes){ h.rustle = Math.max(0, h.rustle - dt * 3); h.glow += ((h === B.hole && B.ph !== 'idle' ? 1 : .35) - h.glow) * Math.min(1, dt * 6); }

  if (B.ph === 'idle'){
    B.t -= dt; if (B.t <= 0){ B.hole = pickHole(); B.last = B.hole.id; B.ph = 'rustle'; B.t = .55 / s; B.p = 0; }
  } else if (B.ph === 'rustle'){
    B.hole.rustle = 1; B.t -= dt;
    if (Math.random() < dt * 14) dirt(B.hole.x, B.hole.y, 1);
    if (B.t <= 0){ B.ph = 'rise'; B.q = 0; B.max = Math.random() < .22 ? .5 : 1; B.hold = (B.max < 1 ? .3 : rnd(.9, 1.9)) / s; dirt(B.hole.x, B.hole.y, 12); ring(B.hole.x, B.hole.y, '255,190,60'); }
  } else if (B.ph === 'rise'){
    B.q += dt / (.24 / s); B.p = easeOutBack(Math.min(1, B.q)) * B.max;
    if (B.q >= 1){ B.ph = 'up'; B.p = B.max; }
  } else if (B.ph === 'up'){
    B.hold -= dt; if (B.hold <= 0){ B.ph = 'fall'; B.q = 1; }
  } else if (B.ph === 'caught'){
    B.caught -= dt; if (B.caught <= 0){ B.ph = 'fall'; B.q = 1; }
  } else if (B.ph === 'fall'){
    B.q -= dt / (.2 / s); B.p = Math.max(0, B.q) * Math.max(.5, B.max);
    if (B.q <= 0){ B.p = 0; B.ph = 'idle'; B.t = (Math.random() < .25 ? .15 : rnd(.35, 1.2)) / s; dirt(B.hole.x, B.hole.y, 5); }
  }
}

/* Static hole art is painted ONCE into cached images (blurs and glows are far too slow to redo every frame). */
function ellRad(g, rx, ry, dy, stops){
  g.save(); g.translate(0, dy); g.scale(1, ry / rx); g.fillStyle = rad(g, 0, 0, 0, rx, stops);
  g.beginPath(); g.arc(0, 0, rx, 0, TAU); g.fill(); g.restore();
}
function bakeHole(h){
  const s = h.s, w = Math.ceil(2 * (h.rx + 170 * s)), hh = Math.ceil(2 * (h.ry + 120 * s));
  h.ox = w / 2; h.oy = hh / 2;
  const at = fn => mk(w, hh, g => { g.translate(h.ox, h.oy); fn(g); });
  const rim = (g, a0, a1, col, lw) => { g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round';
    g.beginPath(); g.ellipse(0, 0, h.rx + 5, h.ry + 3, 0, a0, a1); g.stroke(); };

  h.base = at(g => {                                                    // dirt mound + dark hollow
    ellRad(g, h.rx + 30 * s, h.ry + 17 * s, 6 * s, [[0,'#2a180b'],[.72,'#4a2e17'],[.9,'#6a4524'],[1,'rgba(40,24,10,0)']]);
    for (let i = 0; i < 90; i++){
      const a = rnd(0, TAU), r = rnd(4, 28) * s;
      ell(g, Math.cos(a) * (h.rx + r), Math.sin(a) * (h.ry + r * .55) + 4 * s, rnd(1, 3.2), rnd(1, 2.4),
          Math.random() < .5 ? 'rgba(150,108,60,.55)' : 'rgba(25,14,6,.55)');
    }
    ellRad(g, h.rx, h.ry, 0, [[0,'#020100'],[.55,'#100803'],[1,'#3c2510']]);
    g.save(); g.beginPath(); g.ellipse(0, 0, h.rx, h.ry, 0, 0, TAU); g.clip();
    g.strokeStyle = 'rgba(255,165,50,.3)'; g.lineWidth = 16 * s; g.beginPath(); g.ellipse(0, 4 * s, h.rx - 6, h.ry - 4, 0, Math.PI, TAU); g.stroke();   // lit back wall
    g.restore();
  });
  h.pool = at(g => {                                                    // warm light on the ground + blurred rim glow
    ellRad(g, h.rx + 150 * s, h.ry + 100 * s, 0, [[0,'rgba(255,170,40,.0)'],[.5,'rgba(255,160,30,.30)'],[1,'rgba(255,140,0,0)']]);
    g.shadowColor = '#ffa500'; g.shadowBlur = 38 * s;
    rim(g, 0, TAU, '#ffb52e', 9 * s); rim(g, 0, TAU, '#ffb52e', 9 * s);
  });
  const pebs = front => { for (const p of h.pebbles) if ((Math.sin(p.a) >= 0) === front) pebble(ctxOf, h, p); };
  let ctxOf = null;
  h.rimBack = at(g => {
    ctxOf = g;
    rim(g, Math.PI, TAU, '#ffcf4a', 8 * s); rim(g, Math.PI, TAU, 'rgba(255,244,190,.9)', 3 * s);
    pebs(false);
    for (let k = 0; k < 5; k++){                                         // little flowers just outside the rim
      const a = -Math.PI * rnd(.1, .9), d = rnd(32, 62) * s, x = Math.cos(a) * (h.rx + d), y = Math.sin(a) * (h.ry + d * .45);
      const col = FLOWERS[k % FLOWERS.length], r = rnd(4, 6.5) * s;
      g.fillStyle = rad(g, x, y, 0, r * 3.2, [[0,'rgba(255,255,255,.35)'],[1,'rgba(255,255,255,0)']]); g.beginPath(); g.arc(x, y, r * 3.2, 0, TAU); g.fill();
      for (let p = 0; p < 5; p++){ const pa = p / 5 * TAU; ell(g, x + Math.cos(pa) * r, y + Math.sin(pa) * r, r * .85, r * .85, col); }
      ell(g, x, y, r * .6, r * .6, '#fff6a0');
    }
  });
  h.rimFront = at(g => {
    ctxOf = g;
    rim(g, 0, Math.PI, '#ffcf4a', 8 * s); rim(g, 0, Math.PI, 'rgba(255,244,190,.9)', 3 * s);
    pebs(true);
  });
}
function pebble(g, h, p){
  const x = Math.cos(p.a) * (h.rx + 6), y = Math.sin(p.a) * (h.ry + 3), w = p.w * h.s, hh = p.h * h.s;
  g.save(); g.translate(x, y); g.rotate(p.a * .5 + p.r);
  g.fillStyle = 'rgba(0,0,0,.4)'; g.beginPath(); g.ellipse(2, hh * .6, w, hh * .8, 0, 0, TAU); g.fill();       // contact shadow
  g.fillStyle = rad(g, -w * .3, -hh * .4, 1, w * 1.1, [[0,'#fffdf0'],[.5,'#f3dca6'],[1,'#b78b4d']]);
  g.strokeStyle = 'rgba(255,170,30,.9)'; g.lineWidth = 2;
  g.beginPath(); g.ellipse(0, 0, w, hh, 0, 0, TAU); g.fill(); g.stroke();
  g.restore();
}
function tuft(g, h, tf){
  const bx = Math.cos(tf.a) * (h.rx + 4), by = Math.sin(tf.a) * (h.ry + 2);
  g.lineCap = 'round';
  for (let i = 0; i < tf.n; i++){
    const spread = (i - (tf.n - 1) / 2) * 11 * h.s, len = tf.len * h.s * (.8 + (i % 2) * .3);
    const sway = Math.sin(clock * 1.8 + h.id + i) * 4 * h.s + h.rustle * Math.sin(clock * 34 + i * 2) * 9 * h.s;
    const x0 = bx + spread * .3, cx = bx + spread * .6 + sway * .4, cy = by - len * .55, x1 = bx + spread + sway, y1 = by - len;
    g.beginPath(); g.moveTo(x0, by); g.quadraticCurveTo(cx, cy, x1, y1);
    g.strokeStyle = 'rgba(125,211,33,.22)'; g.lineWidth = 10 * h.s; g.stroke();
    g.strokeStyle = '#3f9418'; g.lineWidth = 4.6 * h.s; g.stroke();
    g.strokeStyle = '#c8f85e'; g.lineWidth = 2.2 * h.s; g.stroke();
  }
}

function drawHole(h, withCritter){
  const g = ctx, { x, y, rx, ry } = h, glow = h.glow, pulse = .8 + Math.sin(clock * 3 + h.id) * .2;
  g.drawImage(h.base, x - h.ox, y - h.oy);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = Math.min(1, (.45 + .55 * glow) * pulse);
  g.drawImage(h.pool, x - h.ox, y - h.oy);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.drawImage(h.rimBack, x - h.ox, y - h.oy);
  g.save(); g.translate(x, y);
  for (const tf of h.tufts) tuft(g, h, tf);
  if (withCritter){
    const kind = KINDS[state.kind], sc = h.s, pop = B.p;
    g.save();
    g.beginPath(); g.rect(-rx - 60, -400, 2 * rx + 120, 400 + ry * .45); g.clip();       // hide whatever is below the front lip
    g.translate(0, (1 - pop) * 190 * sc);
    const wig = B.ph === 'up' ? Math.sin(clock * 5) * .05 : 0;
    const stretch = B.ph === 'rise' ? 1 + (1 - Math.min(1, B.q)) * .14 : 1 + Math.sin(clock * 3) * .015;
    let squash = 1;
    if (B.ph === 'caught'){ squash = 1 - Math.abs(Math.sin(B.caught * 14)) * .12; }
    g.scale(sc * (2 - stretch) * (B.ph === 'caught' ? 1.06 : 1), sc * stretch * squash);
    g.rotate(wig);
    if (state.kind !== 'dot') halo(g);
    kind.draw(g, clock, { look: B.ph === 'caught' ? 0 : B.look, blink: B.ph === 'caught' ? 1 : B.blink });
    g.restore();
    if (B.ph === 'caught'){                                                              // dizzy stars
      for (let i = 0; i < 4; i++){ const a = clock * 6 + i * TAU / 4, sx = Math.cos(a) * 52 * sc, sy = -150 * sc + Math.sin(a) * 14;
        g.fillStyle = 'rgba(255,176,0,.35)'; star(g, sx, sy, 20, a);
        g.fillStyle = '#ffd84a'; star(g, sx, sy, 11, a); }
    }
  }
  g.restore();
  g.drawImage(h.rimFront, x - h.ox, y - h.oy);
}
/* ================= roam mode (a critter that scampers around the whole area) ================= */
const R = { x: W/2, y: H/2, tx: W/2, ty: H/2, st: 'idle', t: 1, sp: 0, face: -1, ph: 0, caught: 0, dir: 1 };
function rPick(){ const m = 130; let t = 0, x, y;
  do { x = rnd(m, W-m); y = rnd(m, H-m); } while (Math.hypot(x-R.x, y-R.y) < 280 && t++ < 25); R.tx = x; R.ty = y; }
function rDash(){ rPick(); R.st = 'dash'; R.sp = rnd(420, 880) * state.speed; R.dir = Math.random() < .5 ? -1 : 1; dirt(R.x, R.y + 40, 6); }
function roamFlee(fx, fy){ const a = Math.atan2(R.y - fy, R.x - fx) + rnd(-.4, .4), d = rnd(420, 670);
  R.tx = Math.min(W-110, Math.max(110, R.x + Math.cos(a)*d)); R.ty = Math.min(H-110, Math.max(110, R.y + Math.sin(a)*d));
  R.st = 'dash'; R.sp = 950 * state.speed; dirt(R.x, R.y + 40, 8); }
function roamCatch(){ if (R.caught > 0) return; R.caught = 1.4; burstStars(R.x, R.y); ring(R.x, R.y + 40, '255,230,90'); toast('Caught! Treat time'); }
function updateRoam(dt){
  if (R.caught > 0){ R.caught -= dt;
    if (R.caught <= 0){ R.x = rnd(130, W-130); R.y = rnd(130, H-130); R.st = 'idle'; R.t = 1.2; dirt(R.x, R.y + 40, 10); }
  } else if (R.st === 'idle'){ R.t -= dt; if (R.t <= 0) rDash(); }
  else {
    const dx = R.tx - R.x, dy = R.ty - R.y, d = Math.hypot(dx, dy);
    if (d < 14){ R.st = 'idle'; R.t = Math.random() < .3 ? .12 : rnd(.35, 1.85); }
    else {
      const step = Math.min(d, R.sp * Math.min(1, .3 + d / 220) * dt), nx = dx / d, ny = dy / d;
      const wob = 55 * Math.sin(clock * 16) * R.dir;
      R.x += nx * step - ny * wob * dt; R.y += ny * step + nx * wob * dt;
      if (Math.abs(nx) > .25) R.face = nx > 0 ? 1 : -1;
      R.ph += dt * 22;
    }
  }
  R.x = Math.min(W-60, Math.max(60, R.x)); R.y = Math.min(H-60, Math.max(60, R.y));
}
function drawRoam(){
  if (R.caught > 0) return;
  const k = KINDS[state.kind], moving = R.st === 'dash', bob = moving ? Math.abs(Math.sin(R.ph)) * 14 : Math.sin(clock*7) * 2;
  ctx.save(); ctx.translate(R.x, R.y - bob);
  if (!k.emoji){ drawOrb(ctx, clock); ctx.restore(); return; }
  const hg = ctx.createRadialGradient(0, 0, 14, 0, 0, 150);
  hg.addColorStop(0, 'rgba(255,236,190,.85)'); hg.addColorStop(.55, 'rgba(255,220,150,.4)'); hg.addColorStop(1, 'rgba(255,220,150,0)');
  ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(0, 0, 150, 0, TAU); ctx.fill();
  ctx.rotate(moving ? Math.sin(R.ph * .5) * .07 : 0); ctx.scale(-R.face, 1);
  ctx.font = '170px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(k.emoji, 0, 0);
  ctx.restore();
}

/* ================= ground texture + fireflies ================= */
const GROUND = mk(W, H, g => {
  g.fillStyle = rad(g, W / 2, H / 2, 60, W * .68, [[0,'#11261b'],[.6,'#0a160f'],[1,'#030705']]); g.fillRect(0, 0, W, H);
  const cols = ['#1f4226', '#2a452d', '#3a2d1a', '#143522'];
  for (let i = 0; i < 260; i++){ g.globalAlpha = rnd(.04, .10); ell(g, rnd(0, W), rnd(0, H), rnd(30, 120), rnd(14, 50), cols[i % 4], rnd(0, 3)); }
  g.globalAlpha = 1; g.lineWidth = 1.2; g.lineCap = 'round';
  for (let i = 0; i < 900; i++){
    g.strokeStyle = `rgba(${rnd(60, 120) | 0},${rnd(110, 190) | 0},50,${rnd(.05, .16)})`;
    const x = rnd(0, W), y = rnd(0, H), l = rnd(5, 14);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + rnd(-4, 4), y - l / 2, x + rnd(-5, 5), y - l); g.stroke();
  }
  for (let i = 0; i < 500; i++){ g.fillStyle = `rgba(180,150,100,${rnd(.03, .1)})`; g.fillRect(rnd(0, W), rnd(0, H), rnd(1, 3), rnd(1, 3)); }
});
const FLY = mk(48, 48, g => { g.fillStyle = rad(g, 24, 24, 0, 24, [[0,'rgba(255,255,200,1)'],[.25,'rgba(210,255,120,.6)'],[1,'rgba(180,255,80,0)']]); g.fillRect(0, 0, 48, 48); });
const flies = Array.from({ length: 28 }, () => ({ x: rnd(0, W), y: rnd(0, H), a: rnd(0, TAU), s: rnd(10, 30), ph: rnd(0, TAU), r: rnd(.4, 1) }));
function updateFlies(dt){
  for (const f of flies){
    f.a += rnd(-1, 1) * dt * 3; f.x += Math.cos(f.a) * f.s * dt; f.y += Math.sin(f.a) * f.s * dt * .6;
    f.x = (f.x + W) % W; f.y = (f.y + H) % H;
  }
}
function drawFlies(){
  ctx.globalCompositeOperation = 'lighter';
  for (const f of flies){
    ctx.globalAlpha = (.3 + .7 * Math.max(0, Math.sin(clock * 2 + f.ph))) * .9;
    ctx.drawImage(FLY, f.x - 24 * f.r, f.y - 24 * f.r, 48 * f.r, 48 * f.r);
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

/* ================= main loop ================= */
function draw(){
  ctx.clearRect(0, 0, W, H);
  if (state.bg % 2 === 1) ctx.drawImage(GROUND, 0, 0);
  drawFlies();
  if (state.game === 'burrow'){
    for (const h of holesSorted) drawHole(h, h === B.hole && B.ph !== 'idle' && B.ph !== 'rustle');
  } else drawRoam();
  drawFx();
}
const holesSorted = [...holes].sort((a, b) => a.y - b.y);
function update(dt){
  clock += dt; updateFx(dt); updateFlies(dt);
  state.game === 'burrow' ? updateBurrow(dt) : updateRoam(dt);
}

/* ================= UI ================= */
let toastTimer;
function toast(t){ toastEl.textContent = t; toastEl.classList.add('on'); clearTimeout(toastTimer);
                   toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600); }
function setHud(){
  hud.innerHTML = `<b>${state.game === 'burrow' ? 'Burrows' : 'Roam'}</b> · ${KINDS[state.kind].label} · speed ${state.speed.toFixed(1)}×<br>
    M game mode · 1–4 critter · ↑/↓ speed · B background · R catch + reward · C calibrate · F fullscreen · H hide this<br>
    Tap the critter to “catch” it.`;
}
let hudTimer;
function showHud(){ hud.classList.remove('hide'); clearTimeout(hudTimer); hudTimer = setTimeout(() => hud.classList.add('hide'), 6000); }
function setCal(on){ document.body.classList.toggle('cal', on); document.body.classList.toggle('nocursor', !on); if (!on) save(); }

addEventListener('keydown', e => {
  const k = e.key, cal = document.body.classList.contains('cal');
  if (k === 'c' || k === 'C' || (k === 'Enter' && cal)){ setCal(!cal); return; }
  if (cal && k.startsWith('Arrow')){
    const st = e.shiftKey ? 10 : 1;
    corners[sel][0] += (k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0) / innerWidth;
    corners[sel][1] += (k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0) / innerHeight;
    applyTransform(); save(); e.preventDefault(); return;
  }
  if (cal && '1234'.includes(k) && e.altKey){ sel = +k - 1; markSel(); return; }
  if (cal && k === 'Escape'){ setCal(false); return; }
  if (/^[1-4]$/.test(k)){ state.kind = KIND_ORDER[+k - 1]; toast(KINDS[state.kind].label); }
  else if (k === 'm' || k === 'M'){ state.game = state.game === 'burrow' ? 'roam' : 'burrow'; toast(state.game === 'burrow' ? 'Burrows' : 'Roam'); }
  else if (k === 'ArrowUp' || k === '+' || k === '='){ state.speed = Math.min(2.5, +(state.speed + .1).toFixed(1)); toast(`Speed ${state.speed.toFixed(1)}×`); }
  else if (k === 'ArrowDown' || k === '-'){ state.speed = Math.max(.3, +(state.speed - .1).toFixed(1)); toast(`Speed ${state.speed.toFixed(1)}×`); }
  else if (k === 'b' || k === 'B'){ state.bg++; }
  else if (k === 'r' || k === 'R'){ catchIt(); }
  else if (k === 'f' || k === 'F'){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (k === 'h' || k === 'H'){ hud.classList.toggle('hide'); clearTimeout(hudTimer); return; }
  save(); setHud(); showHud();
});
addEventListener('pointerdown', e => {
  if (document.body.classList.contains('cal')) return;
  const [sx, sy] = screenToStage(e.clientX, e.clientY);
  if (state.game === 'burrow'){
    if (B.hole && (B.ph === 'rise' || B.ph === 'up') && Math.hypot(sx - B.hole.x, sy - popY(B.hole)) < 120 * B.hole.s) catchIt();
    else ring(sx, sy);
  } else {
    if (Math.hypot(sx - R.x, sy - R.y) < 130) roamCatch(); else roamFlee(sx, sy);
  }
});
let moveTimer;
addEventListener('pointermove', () => {
  if (document.body.classList.contains('cal')) return;
  document.body.classList.remove('nocursor'); clearTimeout(moveTimer);
  moveTimer = setTimeout(() => document.body.classList.add('nocursor'), 1500);
});
addEventListener('resize', applyTransform);

if (!KINDS[state.kind]) state.kind = 'squirrel';
if (state.game !== 'roam') state.game = 'burrow';
if (!document.body.classList.contains('cal')) document.body.classList.add('nocursor');
applyTransform(); setHud(); showHud();
let last = performance.now();
(function loop(now){ const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); })(last);
window.__dbg = { B, holes, state };   // handy for poking at it in devtools
})();
</script>
</body>
</html>
